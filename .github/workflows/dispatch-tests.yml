# Thin public gate: dispatch private opendcl/opendcl-tests harness for same-repo PRs only.
# External forks never run tests (no secrets, no private checkout).
#
# Skip (status success, no harness dispatch):
#   - PR label `skip-tests`, or
#   - head commit message contains `@skip-tests` (anywhere in subject/body)
#
# Re-evaluate on unlabel only (not on labeled): removing `skip-tests` re-runs this
# workflow so the head commit is tested unless the message still has `@skip-tests`.
#
# Secret (repo): OPENDCL_TESTS_DISPATCH_TOKEN
#   PAT able to POST repository_dispatch on opendcl/build-lab (self-hosted runner).
#   That job checks out private opendcl/opendcl-tests + OpenDCL sources.
name: Dispatch private tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]

concurrency:
  group: dispatch-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch pr_harness
    # Trusted PRs only — head must be this repository (not a fork).
    # On unlabeled: only re-evaluate when the removed label was skip-tests.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'unlabeled'
          || github.event.label.name == 'skip-tests')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Decide skip vs dispatch
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const labels = (pr.labels || []).map(l => l.name);
            const labelSkip = labels.includes('skip-tests');

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const message = commit.commit.message || '';
            const messageSkip = message.includes('@skip-tests');

            let reason = '';
            if (labelSkip) reason = 'PR label skip-tests';
            else if (messageSkip) reason = 'commit message @skip-tests';

            const skip = Boolean(reason);
            core.setOutput('skip', skip ? 'true' : 'false');
            core.setOutput('reason', reason);
            core.setOutput('sha', sha);
            core.info(skip
              ? `Skip harness: ${reason} (sha ${sha})`
              : `Dispatch harness for sha ${sha}`);

      - name: Skip — success status (no harness)
        if: steps.gate.outputs.skip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.gate.outputs.sha }}',
              state: 'success',
              context: 'opendcl-tests / pr_harness',
              description: 'Skipped (${{ steps.gate.outputs.reason }})',
              // No target_url — no check run / harness details to list.
            });

      - name: Pending commit status
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'opendcl-tests / pr_harness',
              description: 'Dispatching private harness…',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: repository_dispatch → opendcl/build-lab (harness)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENDCL_TESTS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPENDCL_TESTS_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi
          SHA="${{ github.event.pull_request.head.sha }}"
          PR="${{ github.event.pull_request.number }}"
          # Runner is on build-lab; that job checks out opendcl-tests + OpenDCL.
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/opendcl/build-lab/dispatches" \
            -d "$(jq -n \
              --arg et "pr_harness" \
              --arg ref "$SHA" \
              --arg sha "$SHA" \
              --argjson pr "$PR" \
              '{
                event_type: $et,
                client_payload: {
                  opendcl_ref: $ref,
                  opendcl_sha: $sha,
                  pr_number: $pr,
                  status_context: "opendcl-tests / pr_harness",
                  configuration: "Release",
                  rth_level: "cad"
                }
              }')"
          echo "Dispatched pr_harness to build-lab for $SHA (PR #$PR)"

      - name: Mark error if dispatch failed
        if: failure() && steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'error',
              context: 'opendcl-tests / pr_harness',
              description: 'Failed to dispatch private harness',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
