# Thin public gate: dispatch private opendcl/opendcl-tests harness for same-repo PRs only.
# External forks never run tests (no secrets, no private checkout).
#
# Secret (repo): OPENDCL_TESTS_DISPATCH_TOKEN
#   PAT or fine-grained token able to POST repository_dispatch on opendcl/opendcl-tests
#   (classic: repo scope on the private tests repo; fine-grained: Contents read +
#   metadata, and permission to create repository_dispatch / Actions on tests).
name: Dispatch private tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dispatch-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch pr_harness
    # Trusted PRs only — head must be this repository (not a fork).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Pending commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'opendcl-tests / pr_harness',
              description: 'Dispatching private harness…',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: repository_dispatch → opendcl/opendcl-tests
        env:
          GH_TOKEN: ${{ secrets.OPENDCL_TESTS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPENDCL_TESTS_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi
          SHA="${{ github.event.pull_request.head.sha }}"
          PR="${{ github.event.pull_request.number }}"
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/opendcl/opendcl-tests/dispatches" \
            -d "$(jq -n \
              --arg et "pr_harness" \
              --arg ref "$SHA" \
              --arg sha "$SHA" \
              --argjson pr "$PR" \
              '{
                event_type: $et,
                client_payload: {
                  opendcl_ref: $ref,
                  opendcl_sha: $sha,
                  pr_number: $pr,
                  status_context: "opendcl-tests / pr_harness",
                  configuration: "Release",
                  rth_level: "cad"
                }
              }')"
          echo "Dispatched pr_harness for $SHA (PR #$PR)"

      - name: Mark error if dispatch failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'error',
              context: 'opendcl-tests / pr_harness',
              description: 'Failed to dispatch private harness',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
